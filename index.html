h1{margin:0 0 14px;font-size:26px;font-weight:700;letter-spacing:.08em}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 16px;border:2px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}

.hint{margin:6px 2px 0;color:var(--sub);font-size:13px}
.filters{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:13px;padding:4px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ai);border-color:var(--ai);color:#fff}

select{font:inherit;font-size:13px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.flabel{font-size:13px;color:var(--sub);margin-right:6px}
main{max-width:1040px;margin:0 auto;padding:8px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.count{font-size:13px;color:var(--sub);margin:4px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.tile{font:inherit;display:flex;flex-direction:column;align-items:center;padding:8px 4px 6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer}
.tile .g{font-size:34px;line-height:1.2}
.tile .r{font-size:11px;color:var(--sub);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile[aria-pressed="true"]{border-color:var(--ai);background:var(--ai-t);box-shadow:inset 0 0 0 1px var(--ai)}
.empty{padding:36px 12px;text-align:center;color:var(--sub);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
aside{position:sticky;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.sq{position:relative;aspect-ratio:1;border:2px solid var(--ink);border-radius:4px;display:grid;place-items:center;background:var(--tile);overflow:hidden}
.sq::before,.sq::after{content:"";position:absolute;background:repeating-linear-gradient(var(--dir,90deg),var(--shu) 0 6px,transparent 6px 12px);opacity:.55}
.sq::before{left:50%;top:0;bottom:0;width:1px;--dir:180deg}
.sq::after{top:50%;left:0;right:0;height:1px}
.sq span{position:relative;z-index:1;font-size:min(190px,50vw);line-height:1;font-weight:500}
dl{margin:16px 0 0;display:grid;grid-template-columns:4.5em 1fr;gap:8px 10px}
dt{color:var(--sub);font-size:13px;padding-top:2px}
dd{margin:0}
.rd{display:inline-block;margin:0 6px 4px 0;padding:0 8px;border-radius:6px;background:var(--ai-t);color:var(--ai);font-size:14px}
.rd.kun{background:transparent;border:1px solid var(--line);color:var(--ink)}
.en{font-weight:700;font-size:17px}
.rel{display:flex;flex-wrap:wrap;gap:4px}
.rel button{font:inherit;font-size:20px;width:36px;height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);cursor:pointer}
.copy{margin-top:14px;width:100%;font:inherit;font-weight:500;padding:9px;border:1px solid var(--ai);border-radius:10px;background:transparent;color:var(--ai);cursor:pointer}
.rbtn{font:inherit;font-size:12px;margin-left:8px;padding:1px 10px;border:1px solid var(--line);border-radius:99px;background:transparent;color:var(--ai);cursor:pointer}
.st{font-size:11px;color:var(--shu);vertical-align:top}
#boot{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);transition:opacity .5s,visibility .5s}
#boot.done{opacity:0;visibility:hidden}
#boot .in{text-align:center}
#boot .big{font-size:84px;line-height:1;color:var(--ink)}
#boot .t{margin-top:12px;letter-spacing:.3em;color:var(--sub);font-size:14px}
#boot .bar{width:160px;height:3px;margin:18px auto 0;background:var(--line);border-radius:2px;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:var(--shu);animation:bl 1.1s ease-out forwards}
@keyframes bl{to{width:100%}}
@media (prefers-reduced-motion:reduce){#boot .bar i{animation:none;width:100%}#boot{transition:none}}

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--on-ai:#10171d;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25)}}
body{background:radial-gradient(1100px 480px at 88% -8%,rgba(31,78,121,.12),transparent 60%),radial-gradient(800px 380px at -8% 0,rgba(200,55,45,.08),transparent 55%),var(--bg);background-attachment:fixed}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:18px}

.search input:focus{box-shadow:0 0 0 4px rgba(31,78,121,.16),var(--shadow)}

.chips{min-width:0}

.chip{transition:background .15s,color .15s,border-color .15s}

.chip[aria-pressed="true"]{color:var(--on-ai)}
main>section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.count{font-weight:700;color:var(--ink);margin:0}
.grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin-top:10px}

.tile .g{font-size:36px}

dt{font-weight:700;font-size:12px;letter-spacing:.06em}
.rd{font-size:15px;padding:1px 10px;border-radius:99px}

.rel button:hover{border-color:var(--ai);transform:translateY(-1px)}

.copy{margin-top:10px;border-radius:12px;padding:10px;transition:background .15s}

footer{max-width:1040px;margin:0 auto;padding:0 20px 36px;text-align:center;font-size:12px;color:var(--sub)}
#boot{background:radial-gradient(900px 520px at 50% 42%,var(--panel),var(--bg));transition:opacity .5s,visibility .5s,transform .5s}
.so{width:100%;max-width:160px;background:var(--tile);border:1px solid var(--line);border-radius:8px}

.ext{font-size:12px;color:var(--ai)}
html{-webkit-text-size-adjust:100%}
button,.tile,.chip,select,a{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.grip,.ftog{display:none}

function parseSV(text,name){
  const out={},t=text.trim();
  if(t[0]==="{"){try{const j=JSON.parse(t);for(const c in j)if(Array.isArray(j[c]))out[c]=j[c].map(String)}catch(_){}return out}
  const doc=new DOMParser().parseFromString(t,"text/xml");
  const ks=doc.querySelectorAll("kanji");
  if(ks.length){ks.forEach(k=>{const m=(k.getAttribute("id")||"").match(/^kvg:kanji_([0-9a-f]+)$/i);if(!m)return;const ps=[...k.querySelectorAll("path")].map(p=>p.getAttribute("d")).filter(Boolean);if(ps.length)out[String.fromCodePoint(parseInt(m[1],16))]=ps});return out}
  const nm=(name||"").match(/^([0-9a-f]{4,6})/i);
  if(nm){const ps=[...doc.querySelectorAll("path")].map(p=>p.getAttribute("d")).filter(Boolean);if(ps.length)out[String.fromCodePoint(parseInt(nm[1],16))]=ps}

}

(()=>{
  const g=id=>document.getElementById(id),vcs=g("vcs");
  const setQ=t=>{g("q").value=t;g("q").dispatchEvent(new Event("input"))};
  const msg=t=>{vcs.textContent=t};
  const found=(text,from)=>{
    const seen=[];for(const ch of (text.match(/[\u4e00-\u9fff々]/g)||[]))if(!seen.includes(ch)&&K.some(k=>k.c===ch))seen.push(ch);
    if(!seen.length){msg(from+"：漢字が見つかりませんでした"+(text.trim()?"（読み取り結果: "+text.trim().slice(0,30)+"）":""));return}
    setQ(seen[0]);vcs.textContent=from+"で見つけた漢字：";
    seen.slice(0,12).forEach(c=>{const b=document.createElement("button");b.className="chip";b.textContent=c;b.style.margin="0 4px 0 0";b.addEventListener("click",()=>setQ(c));vcs.appendChild(b)});
  };
  let rec=null;
  g("vbtn").addEventListener("click",()=>{
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){msg("このブラウザは音声検索に対応していません");return}
    if(rec){rec.stop();return}
    rec=new SR();rec.lang="ja-JP";rec.interimResults=false;rec.maxAlternatives=1;
    g("vbtn").textContent="聞き取り中…";g("vbtn").setAttribute("aria-pressed","true");msg("話してください（例：「やま」「がっこう」）");
    const done=()=>{rec=null;g("vbtn").textContent="音声";g("vbtn").removeAttribute("aria-pressed")};
    rec.onresult=e=>{const t=e.results[0][0].transcript.replace(/[。、．，.,\s]/g,"");setQ(t);msg("「"+t+"」で検索しました")};
    rec.onerror=e=>{msg(e.error==="not-allowed"?"マイクの使用が許可されていません":e.error==="no-speech"?"声が聞こえませんでした":"音声を認識できませんでした")};
    rec.onend=done;
    try{rec.start()}catch(_){done();msg("音声認識を開始できませんでした")}
  });
  const loadT=()=>window.Tesseract?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";sc.onload=res;sc.onerror=rej;document.head.appendChild(sc)});
  g("cbtn").addEventListener("click",()=>g("cfile").click());
  g("cfile").addEventListener("change",async e=>{
    const file=e.target.files[0];e.target.value="";if(!file)return;
    msg("文字を読み取り中…");
    try{
      let text="";
      if("TextDetector" in window){try{const bm=await createImageBitmap(file);text=(await new TextDetector().detect(bm)).map(x=>x.rawValue).join("")}catch(_){}}
      if(!/[\u4e00-\u9fff]/.test(text)){
        msg("文字を読み取り中…（初回は読み込みに時間がかかります。通信が必要です）");
        await loadT();text=(await Tesseract.recognize(file,"jpn")).data.text;
      }
      found(text,"写真");
    }catch(_){msg("読み取れませんでした（通信をご確認ください）")}
  });
})();

  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);let ev=null;
  const show=()=>{g("ibi").src=window.KN_ICON||"";setTimeout(()=>{g("ib").hidden=false},1200)};
  const hide=days=>{g("ib").hidden=true;if(days)try{localStorage.setItem(KEY,String(Date.now()+days*864e5))}catch(_){}};
  addEventListener("beforeinstallprompt",e=>{e.preventDefault();ev=e;show()});
  if(ios)show();
  g("ibx").addEventListener("click",()=>hide(14));
  g("ibg").addEventListener("click",async()=>{
    if(ev){try{ev.prompt();const r=await ev.userChoice;ev=null;hide(r.outcome==="accepted"?3650:14)}catch(_){hide(0)}}
    else{g("ibg").hidden=true;g("ib").querySelector("small").textContent="Safariの共有ボタン →「ホーム画面に追加」で追加できます。";g("ib").querySelector("small").style.display="block"}
  });
  addEventListener("appinstalled",()=>hide(3650));
})();
/* ---- アップデート機能 ---- */
const APP_VERSION="2026.10.26";
(()=>{
  const g=id=>document.getElementById(id),KEY="kanjisagashi_upurl";
  const ls={get:()=>{try{return localStorage.getItem(KEY)||""}catch(_){return""}},set:v=>{try{localStorage.setItem(KEY,v)}catch(_){}}};
  const cmp=(a,b)=>{const x=a.split(".").map(Number),y=b.split(".").map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d}return 0};
  g("upver").textContent="バージョン "+APP_VERSION;
  const say=(t,btn)=>{const e=g("upstat");e.textContent=t+" ";if(btn){const b=document.createElement("button");b.className="chip";b.textContent=btn.label;b.addEventListener("click",btn.fn);e.appendChild(b)}};
  g("upbtn").addEventListener("click",async()=>{
    let url=/^https?:/.test(location.protocol)?location.href.split("#")[0].split("?")[0]:ls.get();
    if(!url){url=(prompt("最新版のURLを入力してください（https://…）")||"").trim();if(!/^https?:\/\//.test(url)){say("URLが入力されませんでした");return}ls.set(url)}
    say("確認中…");
    try{
      const r=await fetch(url+(url.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});
      if(!r.ok)throw 0;
      const m=(await r.text()).match(/const APP_VERSION="([\d.]+)"/);
      if(!m)throw 0;
      if(cmp(m[1],APP_VERSION)>0)say("新しい版 "+m[1]+" があります。",{label:"更新する",fn:()=>{/^https?:/.test(location.protocol)?location.replace(url+"?v="+m[1]):open(url,"_blank","noopener")}});
      else say("最新の版です。");
    }catch(_){say("確認できませんでした（通信やURLをご確認ください）")}
  });
})();
</script>
